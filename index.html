<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MobileTelco · Collage Maker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0a0a0a;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:1rem;font-weight:700;margin-bottom:2px}
.sub{font-size:.68rem;color:#888;margin-bottom:14px}
.card{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;padding:14px;width:100%;max-width:760px;margin-bottom:12px}
.drop{border:2px dashed #333;border-radius:8px;padding:26px 12px;text-align:center;cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:#7c3aed}
.drop p{font-size:.72rem;color:#aaa;line-height:1.7}
.drop b{color:#a78bfa}
button{font-family:Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.btn{border:none;border-radius:6px;padding:8px 14px;font-size:.72rem;font-weight:700;color:#fff;background:#7c3aed}
.btn.blue{background:#0095f6}
.btn.grey{background:#1a1a1a;border:1px solid #333;color:#aaa}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:.66rem;color:#888;font-weight:700}
select,input[type=text],input[type=number]{background:#161616;border:1px solid #333;border-radius:6px;color:#eee;font-size:.72rem;padding:6px 8px;font-family:Arial,sans-serif}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;border:1px solid #333;background:#111}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:.6rem;line-height:1}
#info{font-size:.66rem;color:#a78bfa;font-weight:700;min-height:1em;margin-top:8px}
#pvWrap{text-align:center}
#pv{max-width:100%;max-height:62vh;border:1px solid #2a2a2a;border-radius:6px;background:#111}
.mode{font-size:.72rem;font-weight:700;border:none;border-radius:6px;padding:8px 14px;color:#fff;background:#1a1a1a;border:1px solid #333}
.mode.on{background:#7c3aed;border-color:#7c3aed}
#est{font-size:.66rem;color:#22c55e;font-weight:700}
.hidden{display:none}
footer{font-size:.6rem;color:#444;margin-top:6px}
</style>
</head>
<body>
<h1>MobileTelco · Collage Maker</h1>
<div class="sub">Upload 2 or more images · auto layout · Fit or Zoom Fill · full HD quality</div>

<div class="card">
  <div class="drop" id="drop">
    <p><b>Browse</b> · Drop images here · Ctrl+V paste<br><span style="color:#666">2+ images make a collage automatically</span></p>
    <input type="file" id="fileIn" accept="image/*" multiple class="hidden">
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div id="info"></div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:10px">
    <label>Mode</label>
    <button class="mode on" id="mFit" onclick="setMode('fit')">✨ Fit</button>
    <button class="mode" id="mZoom" onclick="setMode('zoom')">🔍 Zoom Fill</button>
    <label style="margin-left:8px">Size</label>
    <select id="size" onchange="render()">
      <option value="1080x1350">1080 × 1350 · Portrait</option>
      <option value="1080x1080">1080 × 1080 · Square</option>
      <option value="1200x675" selected>1200 × 675 · Website</option>
      <option value="1920x1080">1920 × 1080 · Full HD</option>
    </select>
  </div>
  <div id="pvWrap"><canvas id="pv"></canvas></div>
</div>

<div class="card">
  <div class="row">
    <label>File name</label><input type="text" id="fname" value="collage" style="width:130px">
    <label>Format</label>
    <select id="fmt" onchange="render()">
      <option value="webp" selected>WebP</option>
      <option value="jpeg">JPEG</option>
      <option value="png">PNG</option>
    </select>
    <button class="btn blue" id="dlBtn" onclick="download()" disabled>⬇ Download</button>
    <span id="est"></span>
  </div>
</div>
<footer>Collage only · no watermark · no social cards</footer>

<script>
const $=id=>document.getElementById(id);
let imgs=[]; // {img, name}
let mode='fit';
const pv=$('pv'), ctx=pv.getContext('2d');

/* ── input ── */
$('drop').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{addFiles(e.target.files);$('fileIn').value='';};
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over');}));
$('drop').addEventListener('drop',e=>{if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});
window.addEventListener('paste',e=>{const fs=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(fs.length)addFiles(fs);});

function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  const base=imgs.length;
  list.forEach((f,i)=>{imgs[base+i]=null;}); // reserve order
  list.forEach((f,i)=>{
    const r=new FileReader();
    r.onload=ev=>{const im=new Image();im.onload=()=>{imgs[base+i]={img:im,name:f.name};imgs=imgs.filter(Boolean);updateThumbs();render();};im.src=ev.target.result;};
    r.readAsDataURL(f);
  });
}
function removeImg(i){imgs.splice(i,1);updateThumbs();render();}
function updateThumbs(){
  $('thumbs').innerHTML='';
  imgs.forEach((o,i)=>{
    const d=document.createElement('div');d.className='thumb';
    const im=document.createElement('img');im.src=o.img.src;
    const b=document.createElement('button');b.textContent='✕';b.onclick=()=>removeImg(i);
    d.appendChild(im);d.appendChild(b);$('thumbs').appendChild(d);
  });
}

/* ── layout (same math as mt-tools Auto Collage) ── */
function layoutName(n){
  if(n===1)return 'Single image';
  if(n===2)return '2-col side-by-side';
  if(n===3)return '1 top + 2 bottom';
  if(n===4)return '2×2 grid';
  if(n===5)return '2-top + 3-bottom';
  if(n===6)return '2×3 grid';
  return n+'-image mosaic';
}
function cells(n,W,H){
  // exact tiling, no gaps between cells (no separator look)
  if(n===1)return[{x:0,y:0,w:W,h:H}];
  if(n===2){ // side-by-side at every canvas shape, exact tiling
    const hw=Math.floor(W/2);
    return[{x:0,y:0,w:hw,h:H},{x:hw,y:0,w:W-hw,h:H}];
  }
  if(n===3){const tH=Math.round(H*0.55),hw=Math.floor(W/2);
    return[{x:0,y:0,w:W,h:tH},{x:0,y:tH,w:hw,h:H-tH},{x:hw,y:tH,w:W-hw,h:H-tH}];}
  if(n===4){const hw=Math.floor(W/2),hh=Math.floor(H/2);
    return[{x:0,y:0,w:hw,h:hh},{x:hw,y:0,w:W-hw,h:hh},{x:0,y:hh,w:hw,h:H-hh},{x:hw,y:hh,w:W-hw,h:H-hh}];}
  if(n===5){const tH=Math.round(H*0.5),tw=Math.floor(W/2),bw=Math.floor(W/3);
    return[{x:0,y:0,w:tw,h:tH},{x:tw,y:0,w:W-tw,h:tH},{x:0,y:tH,w:bw,h:H-tH},{x:bw,y:tH,w:bw,h:H-tH},{x:bw*2,y:tH,w:W-bw*2,h:H-tH}];}
  const rows=n<=6?2:Math.ceil(Math.sqrt(n)),cols=Math.ceil(n/rows),cw=Math.floor(W/cols),ch=Math.floor(H/rows);
  const out=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(out.length>=n)break;out.push({x:c*cw,y:r*ch,w:cw,h:ch});}
  return out;
}
function drawCell(c,img,cell,m){
  const{x,y,w,h}=cell;if(!img||w<=0||h<=0)return;
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  const iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1;
  const sc=m==='zoom'?Math.max(w/iw,h/ih):Math.min(w/iw,h/ih);
  const dw=iw*sc,dh=ih*sc,dx=x+(w-dw)/2,dy=y+(h-dh)/2;
  if(m==='fit'){c.fillStyle='#ffffff';c.fillRect(x,y,w,h);}
  c.drawImage(img,dx,dy,dw,dh);c.restore();
}
function drawSep(c,cs){
  c.save();c.strokeStyle='rgba(0,0,0,0.35)';c.lineWidth=2;
  cs.forEach(k=>{if(k.x>0){c.beginPath();c.moveTo(k.x,k.y);c.lineTo(k.x,k.y+k.h);c.stroke();}
    if(k.y>0){c.beginPath();c.moveTo(k.x,k.y);c.lineTo(k.x+k.w,k.y);c.stroke();}});
  c.restore();
}

/* ── render ── */
function setMode(m){mode=m;$('mFit').classList.toggle('on',m==='fit');$('mZoom').classList.toggle('on',m==='zoom');render();}
function curSize(){const[a,b]=$('size').value.split('x').map(Number);return[a,b];}
let lastQ=0.92;
function render(){
  const[W,H]=curSize();pv.width=W;pv.height=H;
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  const n=imgs.length;
  if(n===0){$('info').textContent='';$('dlBtn').disabled=true;$('est').textContent='';return;}
  const cs=cells(n,W,H);
  imgs.forEach((o,i)=>{if(cs[i])drawCell(ctx,o.img,cs[i],mode);});
  // no separators (user request 21 Oct)
  const lname=layoutName(n);
  $('info').textContent=n>=2?('✓ '+lname+' · '+n+' images · '+(mode==='zoom'?'Zoom Fill':'Fit')):'1 image · add more for collage';
  $('dlBtn').disabled=false;
  estimate();
}
function estimate(){
  const fmt=$('fmt').value;
  lastQ=1; // always max quality, no KB limit
  if(fmt==='png'){$('est').textContent='PNG · lossless HD';return;}
  const kb=Math.round(pv.toDataURL('image/'+fmt,1).length*3/4/1024);
  $('est').textContent='≈ '+kb+' KB · max quality';
}
function download(){
  if(!imgs.length)return;
  const fmt=$('fmt').value, ext=fmt==='jpeg'?'jpg':fmt;
  const q=fmt==='png'?undefined:1; // HD always
  const a=document.createElement('a');
  a.href=pv.toDataURL('image/'+fmt,q);
  a.download=($('fname').value.trim()||'collage')+'.'+ext;
  a.click();
}
render();
</script>
</body>
</html>
